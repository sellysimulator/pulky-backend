# The check Render's autoDeployTrigger: checksPass waits for.
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: black --check app tests
      - run: mypy app
      - run: pytest -m "not dbschema" --cov=app
      # Docker is available on the hosted runner, so Testcontainers works.
      - run: pytest -m dbschema --cov=app --cov-append
      - run: coverage report --fail-under=80
      - run: coverage report --include="app/core/*" --fail-under=95
      - run: docker build .
